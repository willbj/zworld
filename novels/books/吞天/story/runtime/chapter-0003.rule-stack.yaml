layers:
  - id: L1
    name: hard_facts
    precedence: 100
    scope: global
  - id: L2
    name: author_intent
    precedence: 80
    scope: book
  - id: L3
    name: planning
    precedence: 60
    scope: arc
  - id: L4
    name: current_task
    precedence: 70
    scope: local
sections:
  hard:
    - story_frame
    - current_state
    - book_rules
    - roles
  soft:
    - author_intent
    - current_focus
    - volume_map
  diagnostic:
    - anti_ai_checks
    - continuity_audit
    - style_regression_checks
overrideEdges:
  - from: L4
    to: L3
    allowed: true
    scope: current_chapter
  - from: L4
    to: L2
    allowed: false
    scope: current_chapter
  - from: L4
    to: L1
    allowed: false
    scope: current_chapter
activeOverrides:
  - from: L4
    to: L3
    target: chapter:3/mustAvoid
    reason: 禁止主角突然仁慈、犯蠢、讲武德
  - from: L4
    to: L3
    target: chapter:3/mustAvoid
    reason: 禁止用“暴涨”“海量”跳过数值结算
  - from: L4
    to: L3
    target: chapter:3/mustAvoid
    reason: 禁止无铺垫的能力觉醒或退场角色回归
  - from: L4
    to: L3
    target: chapter:3/mustAvoid
    reason: 禁止在没有铺垫的情况下突然塞入新体系/新地图/新外挂解决问题
  - from: L4
    to: L3
    target: chapter:3/mustAvoid
    reason: 禁止反派像木桩一样排队送死——每个主要对手必须有独立动机和应变
